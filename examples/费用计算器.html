<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>费用计算器</title><style>body{margin:0;background:#f7f5f0;color:#3e443f;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:500px;padding:34px;margin:7vh auto;background:white;border:1px solid #e3e6dc;border-radius:18px}h1{font-size:28px}p{color:#7d857b;line-height:1.8}label{display:block;margin:20px 0}input{display:block;box-sizing:border-box;width:100%;padding:13px;margin-top:9px;border:1px solid #d3dbd0;border-radius:7px;font:inherit}button{background:#267760;color:white;border:0;border-radius:7px;padding:14px;width:100%;cursor:pointer;font:inherit}output{display:block;margin-top:24px;font-size:25px;color:#267760}small{color:#7d857b}</style></head><body><main><small>平铺演示 / 费用计算器</small><h1>费用计算器</h1><p>测试 HTML 内的 JavaScript 在隔离预览中运行。金额仅用于演示。</p><label>单价（元）<input id="price" type="number" min="0" step="0.01" value="99"></label><label>数量<input id="quantity" type="number" min="0" step="1" value="3"></label><button id="calculate" type="button">计算费用</button><output id="result" aria-live="polite">合计：¥297.00</output></main><script>document.getElementById('calculate').addEventListener('click',()=>{const price=Number(document.getElementById('price').value);const quantity=Number(document.getElementById('quantity').value);document.getElementById('result').textContent=Number.isFinite(price)&&Number.isFinite(quantity)&&price>=0&&quantity>=0?'合计：¥'+(price*quantity).toFixed(2):'请输入有效的非负数值';});</script></body></html>

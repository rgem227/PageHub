<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理演示 · 经营数据驾驶舱</title><style>:root{--accent:#64d8f4}*{box-sizing:border-box}body{margin:0;background:#0b1423;color:#e9f1ff;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:48px 28px}header{padding:32px 0;border-bottom:1px solid #29364d;margin-bottom:28px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px}h1{font-size:clamp(27px,4vw,46px);letter-spacing:-1px;line-height:1.3;margin:14px 0}h2{font-size:21px}h3{font-size:15px}p,small{color:#a8bad4}small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px}.card,section{padding:22px;background:#131f33;border:1px solid #29364d;border-radius:16px;margin-bottom:18px;min-width:0}.card strong{display:block;font-size:30px;line-height:1.4;color:var(--accent)}.grid>.card{margin:0}label{display:block;margin:14px 0;color:#b8cae3}input,select,button{font:inherit;border:1px solid #354b68;border-radius:9px;background:#0b1423;color:#e9f1ff;padding:10px 13px;max-width:100%}input[type=number],input[type=text],input[type=color],select{display:block;width:100%;margin-top:7px}button{cursor:pointer;background:var(--accent);color:#0a1420;font-weight:600;margin:8px 8px 0 0}.result{padding:20px;border-left:3px solid var(--accent);background:#0b1423;border-radius:8px;font-size:24px;color:var(--accent)}table{border-collapse:collapse;width:100%;min-width:460px}td,th{padding:14px;text-align:left;border-bottom:1px solid #29364d}th{color:var(--accent);font-size:12px}.table-wrap{overflow:auto}code,pre{background:#0b1423;padding:12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}svg{max-width:100%;height:auto}.timeline article{padding:12px 0 12px 24px;border-left:2px solid var(--accent);position:relative}.timeline article:before{content:"";position:absolute;left:-6px;top:24px;width:10px;height:10px;border-radius:50%;background:var(--accent)}details{border-bottom:1px solid #29364d;padding:16px 0}summary{cursor:pointer;font-weight:600}footer{border-top:1px solid #29364d;margin-top:32px;padding-top:18px;font-size:12px;color:#7790b0}progress{width:100%;accent-color:var(--accent)}.checks label{display:flex;gap:12px;align-items:center}.checks input:checked+span{text-decoration:line-through;color:#6b829f}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid white;outline-offset:3px}@media(max-width:540px){main{padding:22px 16px}header{padding:20px 0}section,.card{padding:18px}}</style></head><body><main><header><span class="eyebrow">PAGEHUB / ADMIN / 数据看板</span><h1>经营数据驾驶舱</h1><p>企业经营与团队协作 · 此页面属于 admin 所在租户</p></header><div class="grid"><article class="card"><small>本月演示营收</small><strong>¥268,400</strong><p>环比 +18.6%</p></article><article class="card"><small>演示订单</small><strong>1,286</strong><p>转化率 8.4%</p></article><article class="card"><small>交付达成</small><strong>96.8%</strong><p>连续 6 周增长</p></article></div><section><h2>季度增长趋势</h2><svg viewBox="0 0 900 240" role="img" aria-label="演示营收逐月增长"><path d="M20 205 L175 175 L330 182 L485 108 L640 125 L870 32" fill="none" stroke="var(--accent)" stroke-width="5"/><path d="M20 205 L175 175 L330 182 L485 108 L640 125 L870 32 L870 230 L20 230Z" fill="var(--accent)" opacity=".12"/></svg></section><footer>PAGEHUB-DEMO-ADMIN-01 · 演示内容与虚构数据 · 与真实业务统计无关</footer></main><script></script></body></html>

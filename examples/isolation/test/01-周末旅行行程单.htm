<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人演示 · 周末旅行行程单</title><style>:root{--accent:#bda2ff}*{box-sizing:border-box}body{margin:0;background:#0b1423;color:#e9f1ff;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:48px 28px}header{padding:32px 0;border-bottom:1px solid #29364d;margin-bottom:28px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px}h1{font-size:clamp(27px,4vw,46px);letter-spacing:-1px;line-height:1.3;margin:14px 0}h2{font-size:21px}h3{font-size:15px}p,small{color:#a8bad4}small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px}.card,section{padding:22px;background:#131f33;border:1px solid #29364d;border-radius:16px;margin-bottom:18px;min-width:0}.card strong{display:block;font-size:30px;line-height:1.4;color:var(--accent)}.grid>.card{margin:0}label{display:block;margin:14px 0;color:#b8cae3}input,select,button{font:inherit;border:1px solid #354b68;border-radius:9px;background:#0b1423;color:#e9f1ff;padding:10px 13px;max-width:100%}input[type=number],input[type=text],input[type=color],select{display:block;width:100%;margin-top:7px}button{cursor:pointer;background:var(--accent);color:#0a1420;font-weight:600;margin:8px 8px 0 0}.result{padding:20px;border-left:3px solid var(--accent);background:#0b1423;border-radius:8px;font-size:24px;color:var(--accent)}table{border-collapse:collapse;width:100%;min-width:460px}td,th{padding:14px;text-align:left;border-bottom:1px solid #29364d}th{color:var(--accent);font-size:12px}.table-wrap{overflow:auto}code,pre{background:#0b1423;padding:12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}svg{max-width:100%;height:auto}.timeline article{padding:12px 0 12px 24px;border-left:2px solid var(--accent);position:relative}.timeline article:before{content:"";position:absolute;left:-6px;top:24px;width:10px;height:10px;border-radius:50%;background:var(--accent)}details{border-bottom:1px solid #29364d;padding:16px 0}summary{cursor:pointer;font-weight:600}footer{border-top:1px solid #29364d;margin-top:32px;padding-top:18px;font-size:12px;color:#7790b0}progress{width:100%;accent-color:var(--accent)}.checks label{display:flex;gap:12px;align-items:center}.checks input:checked+span{text-decoration:line-through;color:#6b829f}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid white;outline-offset:3px}@media(max-width:540px){main{padding:22px 16px}header{padding:20px 0}section,.card{padding:18px}}</style></head><body><main><header><span class="eyebrow">PAGEHUB / TEST / 行程规划</span><h1>周末旅行行程单</h1><p>个人生活与创意工具 · 此页面属于 test 所在租户</p></header><section class="timeline"><h2>山海之间 · 两日计划</h2><article><h3>周六 09:00 · 城市出发</h3><p>轻装出行，准备饮水、雨具和离线地图。</p></article><article><h3>周六 14:00 · 山间步道</h3><p>沿溪漫步，预留摄影和休息时间。</p></article><article><h3>周日 08:30 · 海边日出</h3><p>散步、早餐与自由活动。</p></article><article><h3>周日 16:00 · 返程</h3><p>行程仅为示例，请按天气和交通安排调整。</p></article></section><footer>PAGEHUB-DEMO-TEST-01 · 演示内容与虚构数据 · 与真实业务统计无关</footer></main><script></script></body></html>
